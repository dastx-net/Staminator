[package]
name = "staminator-desktop"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
staminator-core = { path = "../../crates/core" }
stamina-data = { path = "../../crates/stamina-data" }

[dev-dependencies]
accesskit = "0.25.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_Input_KeyboardAndMouse"] }
